<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dumm_dogg</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Page and layout */
        html,body { height: 100%; margin: 0; }
        body {
            background-color: #222;
            color: #ddd;
            font-family: monospace;
            overflow: hidden;
        }

        /* Background video styling */
        #bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            width: auto;
            height: 100vh;
            min-width: 100vw;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -2;
            background: #000;
        }

        /* Dim overlay to make text readable */
        .video-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            justify-content: center;
            text-align: center;
        }

        .header { font-size: 4.5rem; margin: 0; color: #fff; letter-spacing: -2px; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 0%,50%{opacity:1}51%,100%{opacity:0} }

        .social-links { display:flex; gap:25px; margin-top:10px; }
        .social-links a { color:#888; font-size:1.8rem; transition:all .3s; text-decoration:none }
        .social-links a:hover { color:#fff; transform:translateY(-3px) }

        /* Click-to-play splash */
        #splash {
            position: fixed; inset: 0; display:flex; align-items:center; justify-content:center;
            z-index: 5; background: #000; color: #fff; cursor: pointer; user-select:none;
        }

        .splash-text {
            color: #fff;
            font-size: 1.4rem;
            text-align: center;
            padding: 20px 28px;
            pointer-events: none;
        }
        #splash .btn { background: rgba(255,255,255,0.08); padding: 12px 18px; border-radius: 8px; font-size: 1rem }

        /* Small controls panel */
        .controls { position: fixed; right: 12px; bottom: 12px; z-index: 6; color:#ddd; font-size: 14px; background: rgba(0,0,0,0.4); padding:10px; border-radius:8px }

        @media (max-width:600px) { .header { font-size: 2.5rem } }
    </style>
</head>
<body>
    <!-- Background video: place your video file named _.mp4 next to this HTML file -->
    <video id="bgVideo" loop playsinline preload="auto" muted>
           <source src="much.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="video-overlay"></div>

    <!-- Click-to-play splash: user must click to allow unmuted playback on most browsers -->
    <div id="splash">
        <div class="splash-text">Click anywhere</div>
    </div>

    <div class="container">
        <h1 class="header"><span id="text"></span><span class="cursor">_</span></h1>
        <div class="social-links">
            <a href="https://github.com/getthreadcontext" title="GitHub" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a>
            <a href="https://instagram.com/dumm_dogg" title="Instagram" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
            <a href="https://steamcommunity.com/profiles/76561199237595157/" title="Steam" target="_blank" rel="noopener noreferrer"><i class="fab fa-steam"></i></a>
            <a href="https://discord.gg/Ucb6pEyn" title="Discord" target="_blank" rel="noopener noreferrer"><i class="fab fa-discord"></i></a>
        </div>
    </div>

    <!-- controls removed as trimming feature was removed -->

    <script>
        // Typing header (kept from original)
        const names = ['dumm_dogg', 'dumdog', 'dummdogg'];
        let nameIndex = 0, charIndex = 0, isDeleting = false;
        const textElement = document.getElementById('text');

        function type() {
            const currentName = names[nameIndex];
            if (isDeleting) { textElement.textContent = currentName.substring(0, charIndex - 1); charIndex--; }
            else { textElement.textContent = currentName.substring(0, charIndex + 1); charIndex++; }
            let typeSpeed = isDeleting ? 80 : 150;
            if (!isDeleting && charIndex === currentName.length) { typeSpeed = 2000; isDeleting = true; }
            else if (isDeleting && charIndex === 0) { isDeleting = false; nameIndex = (nameIndex + 1) % names.length; typeSpeed = 500; }
            setTimeout(type, typeSpeed);
        }
        type();

        // Video playback logic (simplified)
        const video = document.getElementById('bgVideo');
        const splash = document.getElementById('splash');

        // When clicking splash: remove splash, unmute and play
        function startPlaybackWithSound() {
            splash.style.display = 'none';
            video.muted = false;
            video.play().catch(e => console.warn('Playback failed:', e));
        }

        splash.addEventListener('click', startPlaybackWithSound);

        // Try muted autoplay where permitted
        video.muted = true;
        video.play().catch(()=>{});
    </script>
</body>
</html>
